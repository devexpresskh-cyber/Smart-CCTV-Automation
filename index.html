    <script>
      // Fix for Chrome extensions attempting to overwrite window.fetch
      (function() {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = function() {
            return _origFetch.apply(this, arguments);
          };
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Prevent external browser extension errors from breaking application UI
        window.addEventListener('error', function(event) {
          if (
            (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
